version: '3.8'

services:
  chess-analyzer:
    build: .
    container_name: chess-analyzer
    ports:
      - "8501:8501"
    volumes:
      - ./opening_books:/app/opening_books
      - ./stockfish:/app/stockfish
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
